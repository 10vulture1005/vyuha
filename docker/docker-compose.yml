version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: vyuha-db
    restart: always
    environment:
      POSTGRES_USER: vyuha
      POSTGRES_PASSWORD: vyuha_secret_password_change_me
      POSTGRES_DB: vyuha_db
    ports:
      - "127.0.0.1:5432:5432" # Bind to localhost only for host security
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyuha -d vyuha_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vyuha-net

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vyuha-app
    restart: always
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Mount local data and logs directories so downloaded CSVs and logs survive container rebuilds
      - ../data:/app/data
      - ../logs:/app/logs
    networks:
      - vyuha-net

  # Optional development database inspector (disable in production)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vyuha-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vyuha.local
      PGADMIN_DEFAULT_PASSWORD: admin_secret_password
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - db
    networks:
      - vyuha-net
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local

networks:
  vyuha-net:
    driver: bridge
