name: VYUHA Forward Test (Daily Paper Trading)

on:
  schedule:
    # Run at 16:30 IST (11:00 UTC) Monday-Friday after market close (3:30 PM IST)
    - cron: '0 11 * * 1-5'
    # Run at 16:30 IST (11:00 UTC) Sunday for weekly fundamental refresh
    - cron: '0 11 * * 0'
  workflow_dispatch:  # Allow manual triggers for testing

# Serialize runs that update the same database and statement CSV.
concurrency:
  group: forward-test-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  PYTHONPATH: '.'

jobs:
  forward-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # Hash every dependency manifest, not just pyproject.toml — the old
          # key never changed when a transitive dep moved, so the cache went
          # stale silently.
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'uv.lock', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache FinBERT model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Version the key by the model revision so a weight or library bump
          # invalidates it instead of serving a stale archive forever.
          key: finbert-${{ runner.os }}-ProsusAI-fintech-finbert-v1
          restore-keys: |
            finbert-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[agents]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers yfinance quantstats

      # A missing LLM key used to surface as a wall of crewai tracebacks ending
      # in "OPENAI_API_KEY is required" — the CrewAI *native* provider is what
      # raised it, because the crew talks OpenRouter through an explicit
      # base_url. Worse, on some runs the crew swallowed the error and the job
      # went green with empty agent answers. Fail here instead, with a message
      # that names the missing secret.
      - name: Verify required secrets
        env:
          PRIMARY_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FALLBACK_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -uo pipefail
          if [ -z "$PRIMARY_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is not set. config/settings.py defaults LLM_PROVIDER=openrouter, so the crew cannot call any model without it."
            echo "Add it under Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          if [ -z "$FALLBACK_KEY" ]; then
            echo "::warning::GROQ_API_KEY is not set — running primary-only, with no failover if OpenRouter rate-limits."
          fi

      - name: Run Forward Test Paper Cycle
        env:
          DATABASE_URL: sqlite:///vyuha.db
          # Primary route (config/settings.py defaults LLM_PROVIDER=openrouter).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Fallback route (LLM_FALLBACK_PROVIDER=groq).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # News providers for the sentiment stage (NEWS_PROVIDER=auto).
          # Without MARKETAUX_API_KEY the stage falls back to Drishti/RSS and
          # most of the watchlist is recorded SCREENING_FAILED, not clean.
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          DRISHTI_API_KEY: ${{ secrets.DRISHTI_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          INDIAN_API_KEY: ${{ secrets.INDIAN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_TRADING_ENABLED: 'false'
          EXIT_MODE: 'full'
          LOG_LEVEL: INFO
        run: |
          python -c "from db.models import Base; from db.session import sync_engine; Base.metadata.create_all(sync_engine)"
          python scripts/run_daily_pipeline.py
          python scripts/update_readme_stats.py

      - name: Commit updated database state
        uses: ./.github/actions/commit-and-push
        with:
          paths: vyuha.db README.md
          message: "📊 Forward test: $(date -u +'%Y-%m-%d')"

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-test-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30

  weekly-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Run only after the forward test has committed its DB update
    needs: forward-test
    # Run on the weekly (Sunday) cron or on demand.
    #
    # This used to string-match the literal cron expression
    # (`github.event.schedule == '0 11 * * 0'`), which silently disables the
    # whole job if anyone edits the time-of-day in the cron above — no error,
    # just a job that never runs again. Matching the *day-of-week field* is
    # robust to time edits: the weekday cron ('0 11 * * 1-5') does not end in
    # a 0/7, the Sunday one ('0 11 * * 0') does.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      endsWith(github.event.schedule, ' 0') ||
      endsWith(github.event.schedule, ' 7')

    steps:
      - name: Checkout latest state after forward test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'uv.lock', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache FinBERT model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-${{ runner.os }}-ProsusAI-fintech-finbert-v1
          restore-keys: |
            finbert-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[agents]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers yfinance quantstats

      - name: Install Screener HTTP parser dependencies
        run: pip install requests beautifulsoup4

      - name: Verify required secrets
        env:
          PRIMARY_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FALLBACK_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -uo pipefail
          if [ -z "$PRIMARY_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is not set — the weekly refresh cannot call any model."
            exit 1
          fi
          if [ -z "$FALLBACK_KEY" ]; then
            echo "::warning::GROQ_API_KEY is not set — running primary-only, with no failover."
          fi

      - name: Fetch fresh Screener.in statements
        run: |
          mkdir -p logs
          set -o pipefail
          python scripts/fetch_screener_snapshots.py \
            --symbols-file config/universe_nifty500.csv \
            --refresh 2>&1 | tee logs/screener-ingestion.log

      - name: Run Weekly Fundamental + Sentiment Refresh
        env:
          DATABASE_URL: sqlite:///vyuha.db
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          DRISHTI_API_KEY: ${{ secrets.DRISHTI_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          INDIAN_API_KEY: ${{ secrets.INDIAN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_TRADING_ENABLED: 'false'
          EXIT_MODE: 'full'
        run: |
          python -c "from db.models import Base; from db.session import sync_engine; Base.metadata.create_all(sync_engine)"
          python scripts/run_daily_pipeline.py --weekly

      - name: Commit updated state
        uses: ./.github/actions/commit-and-push
        with:
          paths: vyuha.db data/raw/fundamentals_investor.csv
          message: "📋 Weekly refresh: $(date -u +'%Y-%m-%d')"

      - name: Upload Screener ingestion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-ingestion-${{ github.run_number }}
          path: |
            logs/
            data/cache/screener/
            data/raw/fundamentals_investor.csv
          retention-days: 30
          if-no-files-found: warn
